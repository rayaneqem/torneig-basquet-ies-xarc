name: Enviar Notificación de Básquet

on:
  push:
    branches:
      - main
  # Opcional: Ejecutar automáticamente cada lunes a las 9:00 AM
  # schedule:
  #   - cron: '0 9 * * 1'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install nodemailer

      - name: Ejecutar script de envío
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: node notificacion.mjs
